<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>Dmitry Chukhnin</title>
  <meta name="description" content="Dmitry Chukhnin — portfolio at microverse.space/en/dmitry">
  <link rel="canonical" href="https://dmitrychuhnin.github.io/">
  <link rel="icon" href="avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="avatar.jpg">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Dmitry Chukhnin">
  <meta property="og:description" content="Portfolio, projects and work — microverse.space/en/dmitry">
  <meta property="og:url" content="https://dmitrychuhnin.github.io/">
  <meta property="og:image" content="https://dmitrychuhnin.github.io/avatar.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#f3f3f1">

  <link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: "Manrope";
      font-style: normal;
      font-weight: 200 800;
      font-display: swap;
      src: url("fonts/manrope.woff2") format("woff2");
    }

    :root {
      --ink: #111111;
      --paper: #ffffff;
      --muted: #666666;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #e9e9e6 linear-gradient(180deg, #f3f3f1, #e9e9e6) no-repeat;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 40px 24px 24px;
      text-align: center;
      background: var(--paper);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 32px;
      box-shadow: 0 30px 70px -35px rgba(0, 0, 0, 0.25);
      animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .avatar {
      display: block;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      padding: 4px;
      object-fit: cover;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .links { margin-top: 28px; }

    .link + .link { margin-top: 12px; }

    .link {
      --link-bg: #f4f4f2;
      --link-bg-hover: #ececea;
      --link-icon-bg: var(--paper);
      --link-sub: var(--muted);

      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 12px 16px 12px 12px;
      text-align: left;
      text-decoration: none;
      color: var(--ink);
      background: var(--link-bg);
      border: 1px solid transparent;
      border-radius: 20px;
      transition: transform 0.2s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover) {
      .link:hover { background: var(--link-bg-hover); transform: translateY(-2px); }
      .link:hover .link__arrow { transform: translateX(3px); opacity: 1; }
    }

    .link:active { transform: translateY(0) scale(0.985); }
    .link:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .link--primary {
      --link-bg: var(--ink);
      --link-bg-hover: var(--ink);
      --link-icon-bg: rgba(255, 255, 255, 0.12);
      --link-sub: rgba(255, 255, 255, 0.6);

      min-height: 76px;
      color: var(--paper);
      box-shadow: 0 14px 28px -14px rgba(0, 0, 0, 0.45);
    }

    .link__icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--link-icon-bg);
    }

    .link__icon svg { width: 22px; height: 22px; }

    .link__text {
      flex: 1;
      min-width: 0;
      margin: 0 14px;
    }

    .link__title,
    .link__url { display: block; }

    .link__title { font-size: 16px; font-weight: 700; }

    .link__url {
      margin-top: 2px;
      font-size: 13px;
      font-weight: 500;
      color: var(--link-sub);
      overflow-wrap: anywhere;
    }

    .link__arrow {
      flex: none;
      width: 20px;
      height: 20px;
      opacity: 0.55;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    @media (max-width: 389px) {
      body { padding-left: 12px; padding-right: 12px; }
      .card { padding-left: 16px; padding-right: 16px; }
    }

    @media (max-width: 319px) {
      .link__arrow { display: none; }
      .link__text { margin-right: 0; }
    }

    @keyframes rise {
      from { transform: translateY(12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .link, .link__arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="avatar.jpg" alt="" width="120" height="120" fetchpriority="high">
    <h1>Dmitry Chukhnin</h1>

    <nav class="links" aria-label="Links">
      <a class="link link--primary" href="https://microverse.space/en/dmitry">
        <span class="link__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg>
        </span>
        <span class="link__text">
          <span class="link__title">Portfolio</span>
          <span class="link__url">microverse.space/<wbr>en/dmitry</span>
        </span>
        <svg class="link__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

      <a class="link" href="https://github.com/DmitryChuhnin">
        <span class="link__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-1.97c-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        </span>
        <span class="link__text">
          <span class="link__title">GitHub</span>
          <span class="link__url">github.com/<wbr>DmitryChuhnin</span>
        </span>
        <svg class="link__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </nav>
  </main>

  <script>
    // iOS Safari applies :active only when the page listens for touches.
    document.addEventListener("touchstart", function () {}, { passive: true });
  </script>
</body>
</html>
